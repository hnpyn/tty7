[package]
name = "tty7-core"
version.workspace = true
edition.workspace = true
description = "tty7's framework-free core: local PTY panes, shell integration, and the file host the window uses"
repository = "https://github.com/l0ng-ai/tty7"
license = "Apache-2.0"
publish = false

# The whole point of this crate is that it does *not* depend on gpui. Everything
# here has to compile without a windowing toolkit.
[dependencies]
anyhow.workspace = true
log.workspace = true
serde = { workspace = true }
serde_json.workspace = true

# Gitignore matching for the prompt composer's `@` file completion (`core::gitignore`).
ignore = "0.4"

# Cross-platform PTY: a Unix pty on Unix, ConPTY on Windows.
portable-pty = "0.8"

# SIMD byte search for the OSC tokenizer's fast paths.
memchr = "2"

# Base64 for OSC and kitty-graphics payloads.
base64 = "0.22"

# zlib inflate for kitty graphics `o=z` payloads.
miniz_oxide = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# CFStringTokenizer-adjacent CoreFoundation FFI: `daemon::pane` reads a pane's
# foreground process name through it on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

# Toolhelp process enumeration + `TerminateProcess`, used by `daemon::winproc`.
# `Registry` lets `daemon::windows_env` re-read the environment hives.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[features]
default = []

[lints]
workspace = true
